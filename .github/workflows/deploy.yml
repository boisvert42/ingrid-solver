name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Change to master if your default branch is master

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly Crate
        run: wasm-pack build --target web

      - name: Prepare Deployment Directory
        run: |
          mkdir dist
          # Copy frontend files directly to the root of dist
          cp -r www/* dist/
          # Copy pkg and resources to dist
          cp -r pkg dist/
          cp -r resources dist/
          
          # Rewrite paths to resolve relative to the root directory
          # (avoids browser security blocks on parent-directory worker imports)
          sed -i 's|\.\./pkg/|./pkg/|g' dist/solver-worker.js
          sed -i 's|\.\./resources/|resources/|g' dist/index.js
          
          # Remove wasm-pack's generated .gitignore inside dist/pkg/ so git does not ignore the built files during deployment
          rm -f dist/pkg/.gitignore
          
          # Bypass Jekyll processing on GitHub Pages to ensure Wasm/JS files serve correctly
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
